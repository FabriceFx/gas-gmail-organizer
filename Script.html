let currentLang = 'fr';

document.addEventListener("DOMContentLoaded", () => {
    initNavigation();
    initTranslations();
    fetchSettings();
    fetchDashboardStatus();
    
    const btnSave = document.getElementById('btn-save-settings');
    if (btnSave) btnSave.addEventListener('click', onSaveSettings);

    const btnTrigger = document.getElementById('btn-trigger-sort');
    if (btnTrigger) btnTrigger.addEventListener('click', onTriggerSort);

    const btnRetryErrors = document.getElementById('btn-retry-errors');
    if (btnRetryErrors) btnRetryErrors.addEventListener('click', onTriggerRetryErrors);

    const btnTestApi = document.getElementById('btn-test-api');
    if (btnTestApi) btnTestApi.addEventListener('click', onTestApiConnection);

    const toggleAuto = document.getElementById('toggle-auto-sort');
    if (toggleAuto) toggleAuto.addEventListener('change', onToggleAutoSort);
});

function initTranslations() {
    const btnFr = document.getElementById('btn-fr');
    const btnEn = document.getElementById('btn-en');
    
    if (btnFr) btnFr.addEventListener('click', () => setLanguage('fr'));
    if (btnEn) btnEn.addEventListener('click', () => setLanguage('en'));
    
    setLanguage(currentLang);
}

function setLanguage(lang) {
    if (!DICT[lang]) return;
    currentLang = lang;
    
    document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (DICT[lang][key]) {
            el.innerHTML = DICT[lang][key];
        }
    });
    
    const btnFr = document.getElementById('btn-fr');
    const btnEn = document.getElementById('btn-en');
    if (btnFr) btnFr.classList.toggle('active', lang === 'fr');
    if (btnEn) btnEn.classList.toggle('active', lang === 'en');
}

function initNavigation() {
    const navItems = document.querySelectorAll('.nav-links li');
    const sections = document.querySelectorAll('.page-section');
    
    function switchTab(item) {
        navItems.forEach(n => {
            n.classList.remove('active');
            n.setAttribute('aria-selected', 'false');
        });
        item.classList.add('active');
        item.setAttribute('aria-selected', 'true');
        
        const targetId = item.getAttribute('data-target');
        sections.forEach(s => s.classList.remove('active'));
        const targetSection = document.getElementById(targetId);
        if (targetSection) {
            targetSection.classList.add('active');
        }

        if (targetId === 'dashboard') {
            fetchDashboardStatus();
        }
    }

    navItems.forEach(item => {
        item.addEventListener('click', () => switchTab(item));
        item.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                switchTab(item);
            }
        });
    });
}

function showLoader(messageKey) {
    const overlay = document.getElementById('loader-overlay');
    const msgEl = document.getElementById('loader-message');
    msgEl.textContent = DICT[currentLang][messageKey] || "Loading...";
    overlay.classList.remove('hidden');
}

function hideLoader() {
    document.getElementById('loader-overlay').classList.add('hidden');
}

function showSnackbar(message, isError = false) {
    const snackbar = document.getElementById('snackbar');
    snackbar.textContent = message;
    
    if (isError) {
        snackbar.classList.add('error');
    } else {
        snackbar.classList.remove('error');
    }
    
    snackbar.classList.add('show');
    setTimeout(() => {
        snackbar.classList.remove('show');
    }, 4000);
}

function fetchDashboardStatus() {
    google.script.run
        .withSuccessHandler((status) => {
            if (!status || !status.success) return;

            // Auto sort status
            const autoBadge = document.getElementById('badge-auto-sort');
            const toggleAuto = document.getElementById('toggle-auto-sort');
            toggleAuto.checked = status.autoSortActive;
            if (status.autoSortActive) {
                autoBadge.textContent = DICT[currentLang].status_active;
                autoBadge.className = 'status-badge active';
            } else {
                autoBadge.textContent = DICT[currentLang].status_inactive;
                autoBadge.className = 'status-badge inactive';
            }

            // Reset indicator
            const resetInd = document.getElementById('reset-indicator');
            if (status.resetEnCours) {
                resetInd.style.display = 'inline';
            } else {
                resetInd.style.display = 'none';
            }

            // Quarantaine badge
            const qBadge = document.getElementById('badge-quarantaine-count');
            const estQuarantaineVide = status.quarantaineCount === '0' || status.quarantaineCount === 0 || !status.quarantaineCount;
            qBadge.textContent = (status.quarantaineCount || '0') + (currentLang === 'en' ? ' quarantined' : ' en quarantaine');
            qBadge.className = !estQuarantaineVide ? 'status-badge warning' : 'status-badge inactive';

            // Dernier tri
            const dernierTri = status.dernierTri;
            const dateEl = document.getElementById('stat-dernier-tri-date');
            const countEl = document.getElementById('stat-dernier-tri-count');
            const chipUrgent = document.getElementById('chip-urgent');
            const chipRapide = document.getElementById('chip-rapide');
            const chipAttention = document.getElementById('chip-attention');
            const chipAucune = document.getElementById('chip-aucune');

            if (dernierTri && dernierTri.dateIso) {
                const dateObj = new Date(dernierTri.dateIso);
                dateEl.textContent = dateObj.toLocaleDateString(currentLang === 'en' ? 'en-US' : 'fr-FR', {
                    day: 'numeric',
                    month: 'short',
                    hour: '2-digit',
                    minute: '2-digit'
                });
                countEl.textContent = (dernierTri.traites || 0) + (currentLang === 'en' ? ' emails sorted' : ' e-mails triés');

                chipRapide.textContent = '🟠 ' + (dernierTri.rapide || 0) + (currentLang === 'en' ? ' quick' : ' rapides');
                chipAttention.textContent = '🔴 ' + (dernierTri.attention || 0) + (currentLang === 'en' ? ' attention' : ' attention');
                chipAucune.textContent = '🟢 ' + (dernierTri.aucune || 0) + (currentLang === 'en' ? ' no action' : ' aucune');

                if (dernierTri.urgent && dernierTri.urgent > 0) {
                    chipUrgent.style.display = 'inline-flex';
                    chipUrgent.textContent = '⏰ ' + dernierTri.urgent + (currentLang === 'en' ? ' urgent' : ' urgents');
                } else {
                    chipUrgent.style.display = 'none';
                }
            } else {
                dateEl.textContent = currentLang === 'en' ? 'No recent sort' : 'Aucun tri récent';
                countEl.textContent = '0 ' + (currentLang === 'en' ? 'emails' : 'e-mails');
            }

            // Suggestions de règles
            renderSuggestions(status.suggestions);

            // Analytics 7 jours
            renderAnalytics(status.analytics);
        })
        .withFailureHandler((err) => {
            console.error('Erreur chargement statut dashboard', err);
        })
        .getDashboardStatus();
}

function renderAnalytics(analytics) {
    if (!analytics) return;

    const totalEl = document.getElementById('stat-analytics-total');
    const timeEl = document.getElementById('stat-analytics-time');
    const rateEl = document.getElementById('stat-analytics-auto');
    const badgeEl = document.getElementById('badge-analytics-rate');
    const chartContainer = document.getElementById('analytics-chart-container');

    if (totalEl) totalEl.textContent = String(analytics.total7j || 0);
    if (timeEl) timeEl.textContent = analytics.tempsGagneFormatte || '0 min';
    const displayRate = (analytics.tauxAuto !== null && analytics.tauxAuto !== undefined) ? analytics.tauxAuto + '%' : '—';
    if (rateEl) rateEl.textContent = displayRate;
    if (badgeEl) badgeEl.textContent = displayRate === '—' ? '⚡ —' : `⚡ ${displayRate} auto`;

    if (!chartContainer) return;

    const historique = Array.isArray(analytics.historique) ? analytics.historique : [];
    if (historique.length === 0) {
        chartContainer.innerHTML = `<p style="color: var(--md-sys-color-on-surface-variant); text-align: center; font-style: italic; margin: 12px 0;">${escapeHtml(DICT[currentLang].chart_no_data || 'Aucune activité sur les 7 derniers jours.')}</p>`;
        return;
    }

    let maxJour = 1;
    historique.forEach(j => {
        const t = Number(j.traites || 0);
        if (t > maxJour) maxJour = t;
    });

    let barsHtml = '<div class="chart-bars-wrap">';
    historique.forEach(j => {
        const total = Number(j.traites || 0);
        const aucune = Number(j.aucune || 0);
        const rapide = Number(j.rapide || 0);
        const attention = Number(j.attention || 0);
        const urgent = Number(j.urgent || 0);

        const dateObj = new Date(j.dateStr);
        const dateLabel = isNaN(dateObj.getTime())
            ? j.dateStr
            : dateObj.toLocaleDateString(currentLang === 'en' ? 'en-US' : 'fr-FR', { weekday: 'short', day: 'numeric' });

        const barHeightPx = Math.max(8, Math.round((total / maxJour) * 110));

        const pctAucune = total > 0 ? (aucune / total) * 100 : 0;
        const pctRapide = total > 0 ? (rapide / total) * 100 : 0;
        const pctAttention = total > 0 ? (attention / total) * 100 : 0;
        const pctUrgent = total > 0 ? (urgent / total) * 100 : 0;

        barsHtml += `
            <div class="chart-col">
                <span class="chart-col-count">${total}</span>
                <div class="chart-bar-stack" style="height: ${barHeightPx}px;" title="${dateLabel} : ${total} (${aucune} aucune, ${rapide} rapide, ${attention} attention, ${urgent} urgent)">
                    ${pctAucune > 0 ? `<div class="chart-segment segment-aucune" style="height: ${pctAucune}%;"></div>` : ''}
                    ${pctRapide > 0 ? `<div class="chart-segment segment-rapide" style="height: ${pctRapide}%;"></div>` : ''}
                    ${pctAttention > 0 ? `<div class="chart-segment segment-attention" style="height: ${pctAttention}%;"></div>` : ''}
                    ${pctUrgent > 0 ? `<div class="chart-segment segment-urgent" style="height: ${pctUrgent}%;"></div>` : ''}
                </div>
                <span class="chart-col-date">${escapeHtml(dateLabel)}</span>
            </div>
        `;
    });
    barsHtml += '</div>';

    const legendHtml = `
        <div class="chart-legend">
            <div class="legend-item"><span class="legend-dot segment-aucune"></span> <span>${escapeHtml(DICT[currentLang].legend_aucune || 'Aucune action')}</span></div>
            <div class="legend-item"><span class="legend-dot segment-rapide"></span> <span>${escapeHtml(DICT[currentLang].legend_rapide || 'Action rapide')}</span></div>
            <div class="legend-item"><span class="legend-dot segment-attention"></span> <span>${escapeHtml(DICT[currentLang].legend_attention || 'Attention requise')}</span></div>
            <div class="legend-item"><span class="legend-dot segment-urgent"></span> <span>${escapeHtml(DICT[currentLang].legend_urgent || 'Urgent')}</span></div>
        </div>
    `;

    chartContainer.innerHTML = barsHtml + legendHtml;
}

function renderSuggestions(suggestions) {
    const cardEl = document.getElementById('card-suggestions');
    const listEl = document.getElementById('suggestions-list');
    if (!cardEl || !listEl) return;

    if (!Array.isArray(suggestions) || suggestions.length === 0) {
        cardEl.style.display = 'none';
        listEl.innerHTML = '';
        return;
    }

    cardEl.style.display = 'block';
    listEl.innerHTML = '';

    suggestions.forEach(item => {
        const itemEl = document.createElement('div');
        itemEl.className = 'suggestion-item';

        const infoEl = document.createElement('div');
        infoEl.className = 'suggestion-info';
        infoEl.innerHTML = `
            <span class="suggestion-name">${escapeHtml(item.nom || item.email)} <small style="font-weight: normal; opacity: 0.7;">(${item.count} ${currentLang === 'en' ? 'emails' : 'e-mails'})</small></span>
            <span class="suggestion-email">${escapeHtml(item.email)}</span>
        `;

        const actionsEl = document.createElement('div');
        actionsEl.className = 'suggestion-actions';

        // Bouton + VIP
        const btnVip = document.createElement('button');
        btnVip.className = 'btn-chip btn-chip-vip';
        btnVip.textContent = DICT[currentLang].btn_add_vip;
        btnVip.title = "Classer systématiquement en Attention";
        btnVip.addEventListener('click', () => onQuickAddRule('vip', item.email));

        // Bouton + Ignorer
        const btnIgnorer = document.createElement('button');
        btnIgnorer.className = 'btn-chip btn-chip-aucune';
        btnIgnorer.textContent = DICT[currentLang].btn_add_ignore;
        btnIgnorer.title = "Classer systématiquement en Aucune Action";
        btnIgnorer.addEventListener('click', () => onQuickAddRule('aucune', item.email));

        // Bouton + No IA
        const btnNoIa = document.createElement('button');
        btnNoIa.className = 'btn-chip btn-chip-noia';
        btnNoIa.textContent = DICT[currentLang].btn_add_noia;
        btnNoIa.title = "Classer en Attention sans envoyer à Gemini";
        btnNoIa.addEventListener('click', () => onQuickAddRule('noIa', item.email));

        actionsEl.appendChild(btnVip);
        actionsEl.appendChild(btnIgnorer);
        actionsEl.appendChild(btnNoIa);

        itemEl.appendChild(infoEl);
        itemEl.appendChild(actionsEl);
        listEl.appendChild(itemEl);
    });
}

function escapeHtml(str) {
    return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
}

function onQuickAddRule(type, pattern) {
    showLoader('msg_saving');
    
    google.script.run
        .withSuccessHandler((res) => {
            hideLoader();
            if (res && res.success) {
                showSnackbar(DICT[currentLang].msg_rule_added + ` (${res.pattern})`);
                renderSuggestions(res.suggestions);
                fetchSettings();
            }
        })
        .withFailureHandler((err) => {
            hideLoader();
            showSnackbar(err.message, true);
        })
        .quickAddRule(type, pattern);
}

function fetchSettings() {
    google.script.run
        .withSuccessHandler((settings) => {
            const apiKeyInput = document.getElementById('input-api-key');
            apiKeyInput.value = '';
            apiKeyInput.placeholder = settings.hasApiKey
                ? (DICT[currentLang].placeholder_api_key_set || '•••••••••••••••• (Clé configurée)')
                : (DICT[currentLang].placeholder_api_key_empty || 'Entrez votre clé API Gemini');
            document.getElementById('toggle-free-tier').checked = settings.isFreeTier;
            document.getElementById('toggle-category-primary').checked = settings.categoryPrimaryOnly !== false;
            document.getElementById('toggle-detecter-newsletters').checked = settings.detecterNewsletters !== false;
            document.getElementById('select-fenetre-jours').value = String(settings.fenetreJours !== undefined ? settings.fenetreJours : 30);
            
            document.getElementById('input-mots-cles-aucune').value = Array.isArray(settings.motsClesAucune) ? settings.motsClesAucune.join('\n') : '';
            document.getElementById('input-mots-cles-rapide').value = Array.isArray(settings.motsClesRapide) ? settings.motsClesRapide.join('\n') : '';
            document.getElementById('input-regles-alias').value = Array.isArray(settings.reglesAlias) ? settings.reglesAlias.join('\n') : '';

            document.getElementById('input-vip').value = settings.vip.join('\n');
            document.getElementById('input-no-ia').value = settings.noIa.join('\n');
            document.getElementById('input-aucune').value = settings.aucune.join('\n');
            hideLoader();
        })
        .withFailureHandler((error) => {
            hideLoader();
            showSnackbar(DICT[currentLang].msg_fetch_error + " " + error.message, true);
        })
        .getSettings();
}

function onSaveSettings() {
    showLoader('msg_saving');
    
    const settings = {
        apiKey: document.getElementById('input-api-key').value,
        isFreeTier: document.getElementById('toggle-free-tier').checked,
        categoryPrimaryOnly: document.getElementById('toggle-category-primary').checked,
        detecterNewsletters: document.getElementById('toggle-detecter-newsletters').checked,
        fenetreJours: Number(document.getElementById('select-fenetre-jours').value),
        motsClesAucune: document.getElementById('input-mots-cles-aucune').value.split('\n'),
        motsClesRapide: document.getElementById('input-mots-cles-rapide').value.split('\n'),
        reglesAlias: document.getElementById('input-regles-alias').value.split('\n'),
        vip: document.getElementById('input-vip').value.split('\n'),
        noIa: document.getElementById('input-no-ia').value.split('\n'),
        aucune: document.getElementById('input-aucune').value.split('\n')
    };
    
    google.script.run
        .withSuccessHandler((res) => {
            hideLoader();
            if (res && res.reglesRejetees && res.reglesRejetees.length > 0) {
                showSnackbar(
                    DICT[currentLang].msg_save_warning_rejected + " (" + res.reglesRejetees.join(', ') + ")",
                    true
                );
            } else {
                showSnackbar(DICT[currentLang].msg_save_success);
            }
            fetchSettings();
            fetchDashboardStatus();
        })
        .withFailureHandler((error) => {
            hideLoader();
            showSnackbar(DICT[currentLang].msg_save_error + " " + error.message, true);
        })
        .saveSettings(settings);
}

function onTriggerSort() {
    showLoader('msg_sorting');
    
    google.script.run
        .withSuccessHandler((result) => {
            hideLoader();
            if (result.success) {
                const msg = result.messageKey ? DICT[currentLang][result.messageKey] : result.message;
                showSnackbar(msg);
            } else {
                showSnackbar(result.message, true);
            }
            setTimeout(fetchDashboardStatus, 2000);
        })
        .withFailureHandler((error) => {
            hideLoader();
            showSnackbar(error.message, true);
        })
        .lancerTriManuel();
}

function onTriggerRetryErrors() {
    showLoader('msg_retrying');
    
    google.script.run
        .withSuccessHandler((result) => {
            hideLoader();
            if (result.success) {
                const msg = result.messageKey ? DICT[currentLang][result.messageKey] : result.message;
                showSnackbar(msg);
            } else {
                showSnackbar(result.message, true);
            }
            setTimeout(fetchDashboardStatus, 2000);
        })
        .withFailureHandler((error) => {
            hideLoader();
            showSnackbar(error.message, true);
        })
        .lancerRetraitementErreurs();
}

function onToggleAutoSort(e) {
    showLoader('msg_saving');
    const isEnabled = e.target.checked;
    
    google.script.run
        .withSuccessHandler((result) => {
            hideLoader();
            if (result.success) {
                showSnackbar(result.message);
                fetchDashboardStatus();
            } else {
                showSnackbar(result.message, true);
                e.target.checked = !isEnabled;
            }
        })
        .withFailureHandler((error) => {
            hideLoader();
            showSnackbar(error.message, true);
            e.target.checked = !isEnabled;
        })
        .toggleAutoSort(isEnabled);
}

function onTestApiConnection() {
    showLoader('msg_testing_api');
    
    google.script.run
        .withSuccessHandler((result) => {
            hideLoader();
            const descEl = document.getElementById('desc-api-status');
            if (result.success) {
                const msg = currentLang === 'en'
                    ? `Connected (${result.modele}, ${result.latenceMs} ms)`
                    : `Connecté (${result.modele}, ${result.latenceMs} ms)`;
                descEl.textContent = msg;
                descEl.style.color = '#188038';
                showSnackbar(msg);
            } else {
                descEl.textContent = result.message || 'Erreur de connexion';
                descEl.style.color = '#c5221f';
                showSnackbar(result.message, true);
            }
        })
        .withFailureHandler((error) => {
            hideLoader();
            showSnackbar(error.message, true);
        })
        .testerConnexionGemini();
}
</script>
